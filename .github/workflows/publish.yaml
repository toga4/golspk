name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # The tag, the extension and the server must carry the same version, and CHANGELOG.md must describe it.
      - run: |
          extension="v$(jq -r .version vscode/package.json)"
          server="$(go run . version)"
          if [ "$extension" != "$TAG" ] || [ "$server" != "golspk $TAG" ]; then
            echo "::error::The release tag $TAG does not match the extension version $extension or the server version \"$server\""
            exit 1
          fi
          scripts/changelog-section.sh "${TAG#v}" > /dev/null
        env:
          TAG: ${{ github.event.release.tag_name }}

  build:
    needs:
      - check-version
    uses: ./.github/workflows/build.yaml

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
        working-directory: vscode
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: golspk-*
          path: dist
          merge-multiple: true
      # Publishes with Marketplace Trusted Publishing, which exchanges the OIDC token of this job for a short-lived credential.
      - run: npx vsce publish --oidc --packagePath ../dist/*.vsix
        working-directory: vscode
      - run: |
          gh release upload "$TAG" dist/*.vsix
          scripts/changelog-section.sh "${TAG#v}" > notes.md
          gh release edit "$TAG" --notes-file notes.md
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
